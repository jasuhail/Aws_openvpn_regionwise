stages:
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.15.0"
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY

# Canada Pipeline
plan-canada:
  stage: plan
  image: jas6992/gitlabpipeline:latest
  script:
    - echo "Initializing Terraform for OpenVPN deployment in Canada..."
    - cd locations/canada
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - locations/canada/tfplan
  only:
    - canada

apply-canada:
  stage: apply
  image: jas6992/gitlabpipeline:latest
  script:
    - echo "Applying Terraform plan for OpenVPN in Canada..."
    - cd locations/canada
    - terraform init
    - terraform apply -auto-approve tfplan
  when: manual
  only:
    - canada
  environment:
    name: canada

destroy-canada:
  stage: destroy
  image: jas6992/gitlabpipeline:latest
  script:
    - echo "Destroying OpenVPN infrastructure in Canada..."
    - cd locations/canada
    - terraform init
    - terraform destroy -auto-approve
  when: manual
  only:
    - canada
  environment:
    name: canada
    action: stop

