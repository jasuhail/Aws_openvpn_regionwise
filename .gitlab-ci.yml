stages:
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.15.0"
  # AWS credentials will be passed from GitLab variables
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

cache:
  paths:
    - .terraform

# Templates
.plan_template: &plan_template
  stage: plan
  image: jas6992/gitlabpipeline:1.15.0
  before_script:
    - echo "Checking AWS credentials..."
    - aws sts get-caller-identity || echo "AWS credentials not configured"
  script:
    - cd locations/${LOCATION}
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - locations/${LOCATION}/tfplan
    expire_in: 1 hour

.apply_template: &apply_template
  stage: apply
  image: jas6992/gitlabpipeline:1.15.0
  before_script:
    - echo "Applying to ${LOCATION}"
    - aws sts get-caller-identity
  script:
    - cd locations/${LOCATION}
    - terraform init
    - terraform apply -auto-approve tfplan
  when: manual

.destroy_template: &destroy_template
  stage: destroy
  image: jas6992/gitlabpipeline:1.15.0
  before_script:
    - echo "Destroying ${LOCATION}"
    - aws sts get-caller-identity
  script:
    - cd locations/${LOCATION}
    - terraform init
    - terraform destroy -auto-approve
  when: manual

# Canada Jobs
canada-plan:
  stage: plan
  image: jas6992/gitlabpipeline:1.15.0
  before_script:
    - aws sts get-caller-identity
  script:
    - cd locations/canada
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - locations/canada/tfplan
    expire_in: 1 hour
  only:
    - canada

canada-apply:
  stage: apply
  image: jas6992/gitlabpipeline:1.15.0
  before_script:
    - aws sts get-caller-identity
  script:
    - cd locations/canada
    - terraform init
    - terraform apply -auto-approve tfplan
  when: manual
  only:
    - canada
  environment:
    name: canada
    url: https://ca-central-1.console.aws.amazon.com/ec2/v2/home?region=ca-central-1
  needs:
    - canada-plan

canada-destroy:
  stage: destroy
  image: jas6992/gitlabpipeline:1.15.0
  before_script:
    - aws sts get-caller-identity
  script:
    - cd locations/canada
    - terraform init
    - terraform destroy -auto-approve
  when: manual
  only:
    - canada
  environment:
    name: canada
    action: stop
  needs: []

