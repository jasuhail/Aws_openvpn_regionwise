stages:
  - plan
  - apply
  - destroy

default:
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]
  before_script:
    - terraform version

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

# -------------------------
# Canada pipeline
# -------------------------

plan-canada:
  stage: plan
  script:
    - echo "Planning OpenVPN deployment in Canada..."
    - terraform fmt -check -recursive
    - terraform init
        -input=false
        -reconfigure
        -backend-config="locations/canada/backend.config"
    - terraform validate
    - terraform plan
        -input=false
        -var-file="locations/canada/terraform.tfvars"
        -out="canada.tfplan"
  artifacts:
    name: "canada-plan-$CI_COMMIT_SHORT_SHA"
    paths:
      - canada.tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "canada"'

apply-canada:
  stage: apply
  needs:
    - job: plan-canada
      artifacts: true
  script:
    - echo "Applying OpenVPN deployment in Canada..."
    - terraform init
        -input=false
        -reconfigure
        -backend-config="locations/canada/backend.config"
    - terraform apply
        -input=false
        -auto-approve
        canada.tfplan
  when: manual
  manual_confirmation: "Apply the Canada Terraform plan?"
  rules:
    - if: '$CI_COMMIT_BRANCH == "canada"'
  environment:
    name: canada

destroy-canada:
  stage: destroy
  script:
    - echo "Destroying OpenVPN infrastructure in Canada..."
    - terraform init
        -input=false
        -reconfigure
        -backend-config="locations/canada/backend.config"
    - terraform destroy
        -input=false
        -auto-approve
        -var-file="locations/canada/terraform.tfvars"
  when: manual
  manual_confirmation: "Permanently destroy the Canada infrastructure?"
  rules:
    - if: '$CI_COMMIT_BRANCH == "canada"'
  environment:
    name: canada
    action: stop

