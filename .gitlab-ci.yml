stages:
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.15.0"

cache:
  paths:
    - .terraform

.plan_template: &plan_template
  stage: plan
  image: jas6992/gitlabpipeline:1.15.0
  script:
    - cd locations/${LOCATION}
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - locations/${LOCATION}/tfplan
    expire_in: 1 hour

.apply_template: &apply_template
  stage: apply
  image: jas6992/gitlabpipeline:1.15.0
  script:
    - cd locations/${LOCATION}
    - terraform init
    - terraform apply -auto-approve tfplan
  when: manual
  dependencies:
    - ${LOCATION}-plan

.destroy_template: &destroy_template
  stage: destroy
  image: jas6992/gitlabpipeline:1.15.0
  script:
    - cd locations/${LOCATION}
    - terraform init
    - terraform destroy -auto-approve
  when: manual

# Canada Jobs
canada-plan:
  <<: *plan_template
  variables:
    LOCATION: canada
  only:
    - canada

canada-apply:
  <<: *apply_template
  variables:
    LOCATION: canada
  only:
    - canada
  environment:
    name: canada
    url: https://ca-central-1.console.aws.amazon.com/ec2/v2/home?region=ca-central-1

canada-destroy:
  <<: *destroy_template
  variables:
    LOCATION: canada
  only:
    - canada
  environment:
    name: canada
    action: stop

# Ireland Jobs
ireland-plan:
  <<: *plan_template
  variables:
    LOCATION: ireland
  only:
    - ireland

ireland-apply:
  <<: *apply_template
  variables:
    LOCATION: ireland
  only:
    - ireland
  environment:
    name: ireland
    url: https://eu-west-1.console.aws.amazon.com/ec2/v2/home?region=eu-west-1

ireland-destroy:
  <<: *destroy_template
  variables:
    LOCATION: ireland
  only:
    - ireland
  environment:
    name: ireland
    action: stop