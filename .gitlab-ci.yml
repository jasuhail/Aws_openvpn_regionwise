stages:
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.15.0" # Update with the desired Terraform version
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
  TF_BACKEND_BUCKET: "jasland-state-file" # Update with your S3 bucket name
  TF_BACKEND_KEY: "terraform.tfstate"

plan:
  stage: plan
  image: jas6992/gitlabpipeline:latest
  script:
    - echo "Initializing Terraform for OpenVPN deployment..."
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - tfplan

apply:
  stage: apply
  image: jas6992/gitlabpipeline:latest
  script:
    - echo "Applying Terraform plan for OpenVPN..."
    - terraform init
    # - terraform apply -auto-approve tfplan
    - terraform apply -input=false -auto-approve
  when: manual

destroy:
  stage: destroy
  image: jas6992/gitlabpipeline:latest
  script:
    - echo "Destroying OpenVPN infrastructure..."
    - terraform init
    - terraform destroy -auto-approve
  when: manual
