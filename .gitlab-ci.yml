stages:
  - plan
  - apply
  - destroy

default:
  image:
    name: hashicorp/terraform:1.17.2
    entrypoint: [""]

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

# -------------------------
# Canada pipeline
# -------------------------

plan-canada:
  stage: plan
  script:
    - echo "Planning OpenVPN deployment in Canada..."
    - cd locations/canada
    - terraform version
    - terraform fmt -check
    - terraform init -input=false
    - terraform validate
    - terraform plan -input=false -out=tfplan
  artifacts:
    name: "canada-plan-$CI_COMMIT_SHORT_SHA"
    paths:
      - locations/canada/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "canada"'

apply-canada:
  stage: apply
  needs:
    - job: plan-canada
      artifacts: true
  script:
    - echo "Applying OpenVPN deployment in Canada..."
    - cd locations/canada
    - terraform init -input=false
    - terraform apply -input=false -auto-approve tfplan
  when: manual
  manual_confirmation: "Apply the Canada Terraform plan?"
  rules:
    - if: '$CI_COMMIT_BRANCH == "canada"'
  environment:
    name: canada

destroy-canada:
  stage: destroy
  script:
    - echo "Destroying OpenVPN infrastructure in Canada..."
    - cd locations/canada
    - terraform init -input=false
    - terraform destroy -input=false -auto-approve
  when: manual
  manual_confirmation: "Permanently destroy the Canada infrastructure?"
  rules:
    - if: '$CI_COMMIT_BRANCH == "canada"'
  environment:
    name: canada
    action: stop

