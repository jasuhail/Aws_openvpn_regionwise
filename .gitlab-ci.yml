stages:
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.11.4"
  AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY

# Canada Pipeline
plan-canada:
  stage: plan
  image: jas6992/gitlabpipeline:latest
  script:
    - cd locations/canada
    - terraform init -backend-config=backend.config
    - terraform plan
  only:
    - canada

apply-canada:
  stage: apply
  image: jas6992/gitlabpipeline:latest
  script:
    - cd locations/canada
    - terraform init -backend-config=backend.config
    - terraform apply -auto-approve
  when: manual
  only:
    - canada

destroy-canada:
  stage: destroy
  image: jas6992/gitlabpipeline:latest
  script:
    - cd locations/canada
    - terraform init -backend-config=backend.config
    - terraform destroy -auto-approve
  when: manual
  only:
    - canada

